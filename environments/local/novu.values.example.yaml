image:
  tag: "3.19.0"

secrets:
  jwtSecret: replace-with-openssl-rand-hex-32
  storeEncryptionKey: replace-with-32-byte-key-value!!
  novuSecretKey: replace-with-openssl-rand-hex-32

config:
  nodeEnv: local
  apiRootUrl: http://localhost:3000
  dashboardUrl: http://localhost:4000
  websocketUrl: http://localhost:3002

api:
  service:
    type: LoadBalancer
    port: 3000

ws:
  service:
    type: LoadBalancer
    port: 3002

dashboard:
  service:
    type: LoadBalancer
    port: 4000
