apiVersion: v1
kind: Service
metadata:
  name: {{ include "zitadel.fullname" . }}
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.proxy.service.type }}
  selector:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.proxy.service.port }}
      targetPort: proxy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zitadel.fullname" . }}-api
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - name: h2c
      port: 8080
      targetPort: api
      appProtocol: kubernetes.io/h2c
