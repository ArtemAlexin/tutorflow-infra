apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "zitadel.fullname" . }}-bootstrap
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.bootstrap.storageClassName }}
  storageClassName: {{ .Values.bootstrap.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.bootstrap.storage }}

