{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zitadel.fullname" . }}
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
type: Opaque
stringData:
  ZITADEL_MASTERKEY: {{ required "secrets.masterKey is required when existingSecret is empty" .Values.secrets.masterKey | quote }}
  ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: {{ required "secrets.adminPassword is required when existingSecret is empty" .Values.secrets.adminPassword | quote }}
{{- end }}
