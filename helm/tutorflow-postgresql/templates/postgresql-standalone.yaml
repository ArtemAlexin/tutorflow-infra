{{- if eq .Values.mode "standalone" }}
{{- $superuserPassword := required "standalone.superuserPassword is required" .Values.standalone.superuserPassword }}
{{- $tutorflowPassword := required "standalone.credentials.tutorflow is required" .Values.standalone.credentials.tutorflow }}
{{- $temporalPassword := required "standalone.credentials.temporal is required" .Values.standalone.credentials.temporal }}
{{- $zitadelPassword := required "standalone.credentials.zitadel is required" .Values.standalone.credentials.zitadel }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.name }}-standalone
  labels:
    {{- include "tutorflow-postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $superuserPassword | quote }}
  init.sql: |
    CREATE ROLE tutorflow LOGIN PASSWORD '{{ replace "'" "''" $tutorflowPassword }}';
    CREATE ROLE temporal LOGIN PASSWORD '{{ replace "'" "''" $temporalPassword }}';
    CREATE ROLE zitadel LOGIN PASSWORD '{{ replace "'" "''" $zitadelPassword }}';
    CREATE DATABASE tutorflow OWNER tutorflow;
    CREATE DATABASE temporal OWNER temporal;
    CREATE DATABASE temporal_visibility OWNER temporal;
    CREATE DATABASE zitadel OWNER zitadel;
---
{{- range $username, $password := dict "tutorflow" $tutorflowPassword "temporal" $temporalPassword "zitadel" $zitadelPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $username }}.{{ $.Values.postgresql.name }}.credentials.postgresql.acid.zalan.do
  labels:
    {{- include "tutorflow-postgresql.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.name }}
  labels:
    {{- include "tutorflow-postgresql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Values.postgresql.name }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgresql.name }}
  labels:
    {{- include "tutorflow-postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.postgresql.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgresql.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.postgresql.name }}
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.standalone.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.name }}-standalone
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres"]
            periodSeconds: 20
          resources:
            {{- toYaml .Values.standalone.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/00-init.sql
              subPath: init.sql
              readOnly: true
      volumes:
        - name: init
          secret:
            secretName: {{ .Values.postgresql.name }}-standalone
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.volume.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.volume.size | quote }}
{{- end }}
