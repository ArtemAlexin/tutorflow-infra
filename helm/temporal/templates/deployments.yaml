apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal.fullname" . }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: temporal
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: POSTGRES_SEEDS
              value: {{ .Values.database.host | quote }}
            - name: DBNAME
              value: {{ .Values.database.name | quote }}
            - name: VISIBILITY_DBNAME
              value: {{ .Values.database.visibilityName | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secretName is required" .Values.database.secretName }}
                  key: {{ .Values.database.usernameKey }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secretName is required" .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal.fullname" . }}-ui
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: temporal-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ include "temporal.fullname" . }}:7233
            - name: TEMPORAL_UI_PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
