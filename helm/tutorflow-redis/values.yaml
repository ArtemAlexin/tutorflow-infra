mode: operator
redis:
  name: tutorflow-redis
  image: quay.io/opstree/redis:v8.4.2
  sentinelImage: quay.io/opstree/redis-sentinel:v8.4.2
  replicas: 3
  sentinelReplicas: 3
  auth: { password: "", existingSecret: "", secretName: tutorflow-redis-password, passwordKey: password }
  storage: { size: 2Gi, storageClassName: "" }
  resources:
    redis:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
    sentinel:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
standalone:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
