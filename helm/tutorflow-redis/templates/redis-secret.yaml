{{- if not .Values.redis.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.auth.secretName }}
  labels:
    {{- include "tutorflow-redis.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redis.auth.passwordKey }}: {{ required "redis.auth.password is required when existingSecret is empty" .Values.redis.auth.password | quote }}
{{- end }}
