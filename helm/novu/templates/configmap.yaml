apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "novu.fullname" . }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  MONGO_MIN_POOL_SIZE: {{ .Values.mongodb.minPoolSize | quote }}
  MONGO_MAX_POOL_SIZE: {{ .Values.mongodb.maxPoolSize | quote }}
  MONGO_AUTO_CREATE_INDEXES: {{ .Values.mongodb.autoCreateIndexes | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_DB_INDEX: {{ .Values.redis.databaseIndex | quote }}
  REDIS_SKIP_VERSION_CHECK: {{ .Values.redis.skipVersionCheck | quote }}
  {{- if .Values.redis.cacheEnabled }}
  REDIS_CACHE_SERVICE_HOST: {{ .Values.redis.host | quote }}
  REDIS_CACHE_SERVICE_PORT: {{ .Values.redis.port | quote }}
  {{- end }}
  SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: {{ .Values.config.subscriberWidgetJwtExpirationTime | quote }}
  IS_API_IDEMPOTENCY_ENABLED: {{ .Values.config.apiIdempotencyEnabled | quote }}
  IS_API_RATE_LIMITING_ENABLED: {{ .Values.config.apiRateLimitingEnabled | quote }}
  IS_NEW_MESSAGES_API_RESPONSE_ENABLED: {{ .Values.config.newMessagesApiResponseEnabled | quote }}
  IS_V2_ENABLED: {{ .Values.config.v2Enabled | quote }}
  IS_SELF_HOSTED: "true"
  IS_EMAIL_INLINE_CSS_DISABLED: {{ .Values.config.emailInlineCssDisabled | quote }}
  IS_USE_MERGED_DIGEST_ID_ENABLED: {{ .Values.config.useMergedDigestIdEnabled | quote }}
  BROADCAST_QUEUE_CHUNK_SIZE: {{ .Values.config.broadcastQueueChunkSize | quote }}
  MULTICAST_QUEUE_CHUNK_SIZE: {{ .Values.config.multicastQueueChunkSize | quote }}
  NEW_RELIC_ENABLED: {{ .Values.config.newRelicEnabled | quote }}
  NEW_RELIC_APP_NAME: {{ .Values.config.newRelicAppName | quote }}
  NEW_RELIC_LICENSE_KEY: {{ .Values.config.newRelicLicenseKey | quote }}
  SENTRY_DSN: {{ .Values.config.sentryDsn | quote }}
