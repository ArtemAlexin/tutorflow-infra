{{- if not .Values.existingSecret }}
{{- $storeEncryptionKey := required "secrets.storeEncryptionKey is required when existingSecret is empty" .Values.secrets.storeEncryptionKey -}}
{{- if ne (len $storeEncryptionKey) 32 -}}
{{- fail "secrets.storeEncryptionKey must be exactly 32 characters" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "novu.fullname" . }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required when existingSecret is empty" .Values.secrets.jwtSecret | quote }}
  STORE_ENCRYPTION_KEY: {{ $storeEncryptionKey | quote }}
  NOVU_SECRET_KEY: {{ required "secrets.novuSecretKey is required when existingSecret is empty" .Values.secrets.novuSecretKey | quote }}
{{- end }}
