apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-api
  labels:
    {{- include "novu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: novu
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-ws
  labels:
    {{- include "novu.labels" . | nindent 4 }}
    app.kubernetes.io/component: ws
spec:
  type: {{ .Values.ws.service.type }}
  selector:
    app.kubernetes.io/name: novu
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ws
  ports:
    - name: http
      port: {{ .Values.ws.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-dashboard
  labels:
    {{- include "novu.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    app.kubernetes.io/name: novu
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
