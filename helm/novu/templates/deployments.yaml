apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.fullname" . }}-api
  labels:
    {{- include "novu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: novu
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: novu
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.imageRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "novu.fullname" . }}
            - secretRef:
                name: {{ .Values.existingSecret | default (include "novu.fullname" .) }}
          env:
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            - name: API_ROOT_URL
              value: {{ required "config.apiRootUrl is required" .Values.config.apiRootUrl | quote }}
            - name: FRONT_BASE_URL
              value: {{ required "config.dashboardUrl is required" .Values.config.dashboardUrl | quote }}
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "mongodb.secretName is required" .Values.mongodb.secretName }}
                  key: {{ .Values.mongodb.urlKey }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "redis.secretName is required" .Values.redis.secretName }}
                  key: {{ .Values.redis.passwordKey }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /v1/health-check
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /v1/health-check
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /v1/health-check
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
